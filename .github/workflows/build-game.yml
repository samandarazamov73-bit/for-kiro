name: Build Sanatorium game

on:
  push:
    branches: [sanatorium-game-release]
    paths:
      - "soviet_building/game/**"
      - ".github/workflows/build-game.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  RELEASE_TAG: "sanatorium-v1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dir/"
          rm -rf tpl templates.tpz godot.zip

      - name: Import assets and run game tests
        working-directory: soviet_building/game
        run: |
          godot --headless --path . --import
          godot --headless --path . -- --test | tee test.log
          grep -q "ALL TESTS PASSED" test.log

      - name: Export Windows, Linux and macOS builds
        working-directory: soviet_building/game
        run: |
          mkdir -p ../out/Sanatorium-Windows ../out/Sanatorium-Linux
          godot --headless --path . --export-release "Windows"
          godot --headless --path . --export-release "Linux"
          godot --headless --path . --export-release "macOS"
          test -s ../out/Sanatorium-Windows/Sanatorium.exe
          test -s ../out/Sanatorium-Linux/Sanatorium.x86_64
          test -s ../out/Sanatorium-macOS.zip

      - name: Package
        working-directory: soviet_building/out
        run: |
          cp "../game/КАК ИГРАТЬ.txt" Sanatorium-Windows/
          cp "../game/КАК ИГРАТЬ.txt" Sanatorium-Linux/
          chmod +x Sanatorium-Linux/Sanatorium.x86_64
          zip -qr -9 Sanatorium-Windows.zip Sanatorium-Windows
          zip -qr -9 Sanatorium-Linux.zip Sanatorium-Linux
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: soviet_building/out/*.zip
          retention-days: 7

  # Apple M1 runner: launch the exported Mac app, then run the tests and an FPS benchmark from source.
  mac-m1-check:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: builds

      # Godot exports the Mac app unsigned (codesign/codesign=0); Apple Silicon only runs signed code,
      # so it is ad-hoc signed here with Apple's codesign and packed with ditto.
      - name: Sign and package the Mac app
        run: |
          uname -m
          system_profiler SPDisplaysDataType | head -20
          mkdir app && cd app
          ditto -x -k ../builds/Sanatorium-macOS.zip .
          find . | head -20
          plutil -lint Sanatorium.app/Contents/Info.plist
          rm -rf Sanatorium.app/Contents/_CodeSignature
          codesign -dv Sanatorium.app/Contents/MacOS/Sanatorium || true
          codesign --force --sign - --timestamp=none Sanatorium.app/Contents/MacOS/Sanatorium
          codesign --force --sign - --timestamp=none Sanatorium.app
          codesign --verify --deep --strict --verbose=2 Sanatorium.app
          lipo -archs Sanatorium.app/Contents/MacOS/Sanatorium
          mkdir ../mac && ditto -c -k --sequesterRsrc --keepParent Sanatorium.app ../mac/Sanatorium-macOS.zip
          cd ../mac && cp "../soviet_building/game/КАК ИГРАТЬ.txt" . && zip -q Sanatorium-macOS.zip "КАК ИГРАТЬ.txt" && rm "КАК ИГРАТЬ.txt"
          ls -la

      - name: Launch the Mac app from the final archive
        run: |
          mkdir check && cd check
          ditto -x -k ../mac/Sanatorium-macOS.zip .
          codesign --verify --deep --strict --verbose=2 Sanatorium.app
          ./Sanatorium.app/Contents/MacOS/Sanatorium --quit-after 1200 2>&1 | tee ../app.log
          grep -q "Sanatorium loaded" ../app.log
          ! grep -q "SCRIPT ERROR" ../app.log

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: mac/Sanatorium-macOS.zip
          retention-days: 7

      - name: Run tests and benchmark from source
        working-directory: soviet_building/game
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip && rm godot.zip
          G="$PWD/Godot.app/Contents/MacOS/Godot"
          "$G" --headless --path . --import
          "$G" --path . -- --test | tee ../../test.log
          grep -q "ALL TESTS PASSED" ../../test.log
          mkdir -p ../../bench
          "$G" --path . -- --bench --out="$PWD/../../bench" | tee ../../bench/bench.log
          grep BENCH ../../bench/bench.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-m1-check
          path: |
            app.log
            test.log
            bench/

  release:
    needs: [build, mac-m1-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: builds

      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: mac

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          overwrite_files: true
          files: |
            builds/Sanatorium-Windows.zip
            builds/Sanatorium-Linux.zip
            mac/Sanatorium-macOS.zip
